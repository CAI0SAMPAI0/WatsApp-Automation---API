services:
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_PROVIDER: postgresql
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evolution
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution?sslmode=disable
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: evolution
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      REDIS_PREFIX_KEY: evolution_bot
      SERVER_URL: http://evolution_api:8080
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    container_name: postgres
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --port 6379 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: ./backend
    container_name: bot
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evolution
      REDIS_URL: redis://redis:6379
      EVOLUTION_URL: http://evolution_api:8080
      SERVER_URL: http://evolution_api:8080
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      evolution-api:
        condition: service_started
    restart: always
    volumes:
      - ./vectorstore_data:/app/vectorstore
      - ./rag_files:/app/rag_files

volumes:
  evolution_instances:
  postgres_data:
  redis: