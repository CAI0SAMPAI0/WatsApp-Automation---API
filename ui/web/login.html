<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Practices — Login</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-box {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 16px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 4px;
        }

        .login-logo .logo-name {
            font-size: 20px;
            font-weight: 700;
        }

        .login-logo .logo-name span {
            color: var(--accent);
        }

        .login-sub {
            text-align: center;
            font-size: 13px;
            color: var(--text2);
            margin-top: -10px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent3), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity .18s;
        }

        .login-btn:hover {
            opacity: .9;
        }

        .login-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="toast-container"></div>

    <div class="login-wrap">
        <div class="login-box">
            <div class="login-logo">
                <div class="logo-name">Study <span>Practices</span></div>
            </div>
            <p class="login-sub">Entre com suas credenciais</p>

            <div class="field">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email" />
            </div>

            <div class="field">
                <label>Senha</label>
                <input type="password" id="loginSecret" placeholder="Sua chave de acesso" />
            </div>

            <button class="login-btn" id="loginBtn" onclick="handleLogin()">Entrar</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        // se já tem token, vai direto para o app
        if (isLoggedIn()) window.location.href = "index.html";

        async function handleLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const secret = document.getElementById("loginSecret").value.trim();
            const btn = document.getElementById("loginBtn");

            if (!email || !secret) { toast("Preencha todos os campos", "error"); return; }

            btn.disabled = true;
            btn.textContent = "Entrando...";

            const ok = await doLogin(email, secret);

            if (ok) {
                window.location.href = "index.html";
            } else {
                btn.disabled = false;
                btn.textContent = "Entrar";
            }
        }

        // enter para logar
        document.addEventListener("keydown", e => {
            if (e.key === "Enter") handleLogin();
        });

        // toast inline (api.js não está completo aqui ainda)
        function toast(msg, type = "info") {
            const c = document.getElementById("toast-container");
            const el = document.createElement("div");
            el.className = `toast ${type}`; el.textContent = msg; c.appendChild(el);
            setTimeout(() => { el.classList.add("fade-out"); setTimeout(() => el.remove(), 320); }, 3500);
        }
    </script>
</body>

</html>
